<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Job Search System</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23F7751E'/%3E%3Cg transform='translate(8 8) scale(.6667)' fill='none' stroke='%23232326' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='2' y='7' width='20' height='14' rx='2'/%3E%3Cpath d='M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F4F4F5; --surface:#FFFFFF; --surface-2:#F4F4F5; --line:#E7E7EA; --line-2:#EFEFF1;
  --ink:#232326; --ink-2:#3F3F46; --muted:#73737C; --faint:#A1A1AA;
  --orange:#F7751E; --orange-ink:#FFFFFF; --orange-soft:#FEEBDD; --orange-deep:#C4560C;
  --graphite:#262628; --graphite-ink:#FFFFFF;
  --ok:#1F9D55; --ok-soft:#E3F5EA; --no:#D23C2F; --no-soft:#FCE6E3;
  --warn:#B7700A; --warn-soft:#FDF1DC; --info:#1C8BD8; --info-soft:#E1F0FB;
  --track:#E9E9EC;
  --shadow:0 20px 27px 0 rgba(0,0,0,.05); --shadow-sm:0 4px 10px -2px rgba(0,0,0,.08);
  --r:16px; --btn:#262628;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111113; --surface:#1B1B1E; --surface-2:#232327; --line:#2C2C31; --line-2:#26262A;
    --ink:#EDEDEF; --ink-2:#D4D4D8; --muted:#9A9AA3; --faint:#71717A;
    --orange-soft:#3A2414; --orange-deep:#FFA266; --graphite:#2A2A2E;
    --ok:#4ACB7F; --ok-soft:#15301F; --no:#F2796D; --no-soft:#3A1A17;
    --warn:#F0B550; --warn-soft:#342612; --info:#5CB6F2; --info-soft:#132C3E;
    --track:#2E2E33; --btn:#F7751E; --shadow:0 20px 27px 0 rgba(0,0,0,.35); --shadow-sm:0 4px 10px -2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111113; --surface:#1B1B1E; --surface-2:#232327; --line:#2C2C31; --line-2:#26262A;
  --ink:#EDEDEF; --ink-2:#D4D4D8; --muted:#9A9AA3; --faint:#71717A;
  --orange-soft:#3A2414; --orange-deep:#FFA266; --graphite:#2A2A2E;
  --ok:#4ACB7F; --ok-soft:#15301F; --no:#F2796D; --no-soft:#3A1A17;
  --warn:#F0B550; --warn-soft:#342612; --info:#5CB6F2; --info-soft:#132C3E;
  --track:#2E2E33; --btn:#F7751E; --shadow:0 20px 27px 0 rgba(0,0,0,.35); --shadow-sm:0 4px 10px -2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
button,input,select{font:inherit;color:inherit}
a{color:var(--orange-deep)}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

/* shell */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:24px 16px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:8px 12px 20px;font-weight:600;font-size:14.5px;border-bottom:1px solid var(--line);margin-bottom:14px;line-height:1.25}
.logo{width:32px;height:32px;border-radius:9px;background:#F7751E;color:#232326;display:grid;place-items:center;flex-shrink:0}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:12px;color:var(--ink-2);text-decoration:none;font-size:13.5px;font-weight:500}
.nav a .ic{width:32px;height:32px;border-radius:9px;background:var(--surface);box-shadow:var(--shadow-sm);display:grid;place-items:center;color:var(--ink)}
.nav a:hover{color:var(--ink)}
.nav a.on{background:var(--surface);box-shadow:var(--shadow);color:var(--ink);font-weight:600}
.nav a.on .ic{background:var(--orange);color:var(--orange-ink);box-shadow:none}
.nav a .n{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
/* profile module */
.me{margin-top:auto;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.me-h{margin-bottom:10px}
.me-l{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.me-l a{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 6px;border-radius:10px;background:var(--surface-2);color:var(--ink);text-decoration:none;font-size:12.5px;font-weight:600}
.me-l a svg{width:14px;height:14px;color:var(--orange)}
.me-l a:hover{background:var(--orange-soft);color:var(--orange-deep)}

.main{padding:18px 28px 56px;min-width:0;width:100%;max-width:1560px;margin:0 auto}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;margin-bottom:22px}
.crumb{font-size:13px;color:var(--muted)}
.crumb a{color:var(--muted);text-decoration:none}
.crumb a:hover{color:var(--ink)}
.topbar h1{font-size:15.5px;font-weight:600;margin-top:2px}
.tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:340px;max-width:100%;color:var(--muted)}
.search input{border:0;outline:0;background:transparent;width:100%;min-width:0;color:var(--ink)}
.search:focus-within{border-color:var(--orange)}
.search kbd{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--faint)}
.stamp{font-size:12.5px;font-weight:600;color:var(--orange-deep);border:1px solid var(--orange);border-radius:10px;padding:7px 14px;white-space:nowrap}
.mbar,.bnav{display:none}

/* building blocks */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.pad{padding:22px 24px}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:22px 24px 14px}
.ch h2,.card h2{font-size:16px;font-weight:600}
.ch .sub,.sub{color:var(--muted);font-size:13px;margin-top:3px}
.sub b{color:var(--ink-2)}
.lab{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.empty{color:var(--muted);font-size:13px}
.fine{color:var(--faint);font-size:12px}
.link{font-size:12.5px;font-weight:600;color:var(--orange-deep);text-decoration:none;white-space:nowrap}
.link:hover{text-decoration:underline}
.stack{display:flex;flex-direction:column;gap:24px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.no{background:var(--no-soft);color:var(--no)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.info{background:var(--info-soft);color:var(--info)}
.pill.hot{background:var(--orange-soft);color:var(--orange-deep)}
.tag{display:inline-flex;align-items:center;border-radius:8px;padding:3px 9px;font-size:12px;font-weight:500;color:var(--ink-2);background:var(--surface-2);margin:0 6px 6px 0}
.av{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0}
.co{display:flex;align-items:center;gap:12px;min-width:0}
.co-n{font-weight:600;font-size:13.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.co-r{color:var(--muted);font-size:12.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.co>div{min-width:0}
.late{color:var(--no);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:9px 16px;font-weight:600;font-size:12.5px;cursor:pointer;text-decoration:none;white-space:nowrap;background:var(--surface-2);color:var(--ink)}
.btn.dark{background:var(--btn);color:var(--graphite-ink);box-shadow:var(--shadow-sm)}
.btn.line{background:var(--surface);border:1px solid var(--line)}
.btn svg{width:14px;height:14px}
.blk{background:var(--surface-2);border-radius:14px;padding:16px 18px}
.blk+.blk{margin-top:14px}
.blk>.lab{display:block;margin-bottom:10px}
.kv{display:grid;grid-template-columns:minmax(110px,160px) 1fr;gap:9px 16px;margin:0;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.kv dd b{font-weight:600}
.prose{max-width:74ch;overflow-wrap:anywhere}
.prose p+p{margin-top:8px}
ul.pts{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.q{border-left:3px solid var(--orange);background:var(--surface);border-radius:0 10px 10px 0;padding:10px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px;color:var(--ink-2)}
.corr{display:inline-block;font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:1px}
details.clamp>summary{list-style:none;cursor:pointer}
details.clamp>summary::-webkit-details-marker{display:none}
details.clamp .rd{color:var(--orange-deep);font-weight:600;font-size:12.5px;white-space:nowrap}
details.clamp[open]>summary{display:none}
details.fold{border-radius:12px;background:var(--surface-2)}
details.fold+details.fold{margin-top:10px}
details.fold>summary{cursor:pointer;padding:12px 16px;font-weight:600;font-size:13px;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"Mostrar";font-size:12px;color:var(--orange-deep)}
details.fold[open]>summary::after{content:"Ocultar"}
details.fold>div{padding:0 16px 14px}

/* Hoje */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;margin-bottom:24px}
.kpi{border-radius:var(--r);padding:18px 20px;background:var(--graphite);color:var(--graphite-ink);box-shadow:var(--shadow);display:flex;align-items:center;gap:16px;text-decoration:none;min-height:96px}
.kpi.hot{background:var(--orange);color:var(--orange-ink)}
.kpi .ico{width:44px;height:44px;border-radius:50%;background:#fff;color:#232326;display:grid;place-items:center;flex-shrink:0}
.kpi .ico svg{width:19px;height:19px}
.kpi .n{font-size:24px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13.5px;opacity:.92}
.kpi .h{font-size:12px;font-weight:600;opacity:.8;margin-left:auto;text-align:right;align-self:flex-end}
.dash{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(320px,1fr);gap:24px;align-items:start}
.rows .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:12px 24px;border-top:1px solid var(--line-2);text-decoration:none;color:inherit}
.rows .r:hover{background:var(--surface-2)}
.rows .r:last-child{border-radius:0 0 var(--r) var(--r)}
.rows .r .rt{text-align:right;font-size:12.5px;color:var(--muted);white-space:nowrap}
.rows .r .rt .pill{margin-bottom:3px}
.mini .r{padding:10px 24px}
.agenda .it{display:flex;gap:12px;align-items:center;padding:10px 24px;border-top:1px solid var(--line-2);text-decoration:none;color:inherit}
.agenda .it:hover{background:var(--surface-2)}
.date{width:44px;flex-shrink:0;text-align:center;border-radius:10px;background:var(--surface-2);padding:4px 0;line-height:1.1}
.date b{display:block;font-size:16px}
.date span{font-size:10.5px;text-transform:uppercase;color:var(--muted);font-weight:600}
.date.hot{background:var(--orange-soft);color:var(--orange-deep)}
.date.hot span{color:var(--orange-deep)}
.bars{display:flex;flex-direction:column;gap:14px}
.bar-t{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.bar-t span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:4px;background:var(--track);border-radius:4px;margin-top:6px;overflow:hidden}
.track i{display:block;height:100%;background:var(--orange);border-radius:4px}
.note{font-size:12.5px;color:var(--muted);margin-top:16px}

/* list */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.chip.on{background:var(--orange);border-color:var(--orange);color:#fff}
.chip .c{opacity:.75;margin-left:4px}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:0 24px 16px;align-items:center}
.filters select{background:var(--surface-2);border:1px solid transparent;border-radius:9px;padding:6px 10px;font-size:13px;max-width:100%;cursor:pointer}
.filters select.set{background:var(--orange-soft);color:var(--orange-deep);font-weight:600}
.filters .sp{flex:1}
.filters .clear{border:0;background:none;color:var(--orange-deep);font-weight:600;font-size:12.5px;cursor:pointer}
.thead,.trow{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(0,1.15fr) minmax(0,1fr) 84px 84px minmax(0,1.1fr);gap:14px;align-items:center;padding:0 24px}
.thead{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding-block:10px;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.trow{padding-block:13px;border-bottom:1px solid var(--line-2);text-decoration:none;color:inherit}
.trow:hover{background:var(--surface-2)}
.trow:last-child{border-bottom:0}
.cell{font-size:13px;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell small{display:block;color:var(--muted);font-size:12px}
.cell.dim{color:var(--faint)}
.hit{display:inline-block;margin-top:3px;font-size:11.5px;font-weight:600;color:var(--orange-deep);background:var(--orange-soft);border-radius:6px;padding:0 6px}
.more{display:block;width:100%;padding:12px;border:0;border-top:1px solid var(--line-2);background:transparent;cursor:pointer;color:var(--orange-deep);font-weight:600;border-radius:0 0 var(--r) var(--r)}
.none{padding:36px 24px;text-align:center;color:var(--muted)}

/* detail */
.dhead{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;padding:22px 24px;margin-bottom:24px}
.dhead .av{width:52px;height:52px;border-radius:14px;font-size:17px}
.dhead h2{font-size:21px;font-weight:700;line-height:1.2}
.dhead .role{color:var(--ink-2);font-size:14.5px;margin-top:2px}
.dhead .pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.dhead .acts{display:flex;gap:8px;flex-wrap:wrap}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.tabs{display:flex;gap:4px;padding:0 16px;border-bottom:1px solid var(--line-2);overflow-x:auto;scrollbar-width:none}
.tabs a{padding:15px 10px 13px;text-decoration:none;color:var(--muted);font-weight:500;font-size:13.5px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--ink);border-color:var(--orange);font-weight:600}
.tabs a.tech{margin-left:auto;font-size:12.5px}
.tbody{padding:22px 24px 26px}
.sec+.sec{margin-top:24px}
.sec>h3{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.state{display:flex;gap:14px;align-items:flex-start;border-radius:14px;padding:16px 18px;background:var(--surface-2)}
.state .ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--ink);flex-shrink:0}
.state b{font-size:15px}
.state{margin-bottom:24px}
.state.plan{background:var(--orange-soft)}
.state.plan .ico{background:var(--orange);color:#fff}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.facts>div{background:var(--surface-2);border-radius:12px;padding:10px 14px}
.facts span{display:block;font-size:12px;color:var(--muted)}
.facts b{font-weight:600;font-size:13.5px}
.facts small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.rail{position:sticky;top:18px}
.rail .card+.card{margin-top:24px}
details.rnote{margin-top:6px;font-size:12.5px;color:var(--muted)}
details.rnote>summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:4px;color:var(--faint);font-weight:500}
details.rnote>summary::-webkit-details-marker{display:none}
details.rnote>summary::before{content:"+";font-weight:700}
details.rnote[open]>summary::before{content:"−"}
details.rnote>div{margin-top:4px;padding:8px 10px;border-radius:8px;background:var(--surface-2);overflow-wrap:anywhere}
.rail .rk{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;padding:0 24px 20px;font-size:13px;align-items:baseline}
.rail .rk dt{color:var(--muted)} .rail .rk dd{margin:0;text-align:right;font-weight:500;overflow-wrap:anywhere}
.rail .rk dd small{display:block;color:var(--muted);font-weight:400}
.rail .rb{padding:0 24px 20px;font-size:13px}
/* timeline */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:28px 1fr;gap:12px;position:relative;padding-bottom:18px}
.tl li:not(:last-child)::after{content:"";position:absolute;left:13px;top:30px;bottom:0;width:2px;background:var(--line)}
.tl .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);position:relative;z-index:1}
.tl .dot svg{width:14px;height:14px}
.tl li.p .dot{background:var(--orange-soft);color:var(--orange-deep)}
.tl li.big .dot{background:var(--orange);color:#fff}
.tl .d{font-size:12px;color:var(--muted)}
.tl .l{font-weight:600;font-size:13.5px}
.tl .x{margin-top:3px;font-size:13.5px;color:var(--ink-2);overflow-wrap:anywhere}
.tl .q{margin-top:8px}
.tl .rec{margin-top:6px;font-size:12.5px;color:var(--muted)}
.tl.compact li{padding-bottom:12px}
/* answers */
.qa{display:flex;flex-direction:column;gap:10px}
.qa>div{background:var(--surface);border-radius:12px;padding:12px 14px}
.qa .qq{font-size:12.5px;color:var(--muted)}
.qa .aa{margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.qa .nn{margin-top:6px;font-size:12.5px;color:var(--warn)}
.grp{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:6px}
/* prep */
.ai{border-radius:14px;padding:18px 20px;background:var(--orange-soft);margin-bottom:24px}
.ai b{font-size:14.5px}
.ai .ask{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;background:var(--surface);border-radius:10px;padding:10px 12px}
.ai code{font-size:12.5px;flex:1;min-width:200px;overflow-wrap:anywhere}
.warnbox>div{border-left:3px solid var(--warn)}
/* posting */
.post{font-size:14px;line-height:1.65;color:var(--ink-2);max-width:78ch}
.post .src{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);border-radius:6px;padding:2px 8px;margin-bottom:12px}
.post .pt{font-size:18px;font-weight:700;color:var(--ink);margin:0 0 8px}
.post h5{font-size:13.5px;font-weight:700;color:var(--ink);margin:18px 0 6px}
.post p{margin:0 0 8px} .post ul{margin:0 0 8px;padding-left:20px}
.post .pnote{margin:14px 0 0;padding:10px 12px;border-radius:10px;background:var(--warn-soft);font-size:12.5px}
/* tech */
.techintro{font-size:13px;color:var(--muted);margin-bottom:18px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--muted);background:var(--surface);border-radius:6px;padding:1px 6px;white-space:nowrap}
.evl>div{padding:12px 0;border-top:1px solid var(--line)}
.evl>div:first-child{border-top:0;padding-top:0}
.evh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.evh b{color:var(--ink);font-size:13px}
.evh .code{margin-left:auto}
/* system log */
/* metrics */
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);text-align:left;padding:10px 24px;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
table.t td{padding:12px 24px;border-bottom:1px solid var(--line-2)}
table.t tr:last-child td{border-bottom:0}
table.t .n{text-align:right;font-variant-numeric:tabular-nums}

@media (max-width:1280px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dgrid{grid-template-columns:minmax(0,1fr) 300px}
}
@media (max-width:1100px){
  .dash,.mgrid{grid-template-columns:1fr}
  .dgrid{grid-template-columns:1fr}
  .rail{position:static;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
  .rail .card+.card{margin-top:0}
}
@media (max-width:960px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .mbar{display:flex;align-items:center;gap:10px;font-weight:600;margin-bottom:14px}
  .mbar .me-l{margin-left:auto;display:flex;gap:6px}
  .mbar .me-l a{padding:6px 10px;background:var(--surface);box-shadow:var(--shadow-sm)}
  .main{padding:16px 16px 92px}
  .topbar{margin-bottom:16px}
  .tools,.search{width:100%}
  .stamp{display:none}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
  .bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--muted);text-decoration:none;padding:4px 10px;border-radius:10px}
  .bnav a svg{width:20px;height:20px}
  .bnav a.on{color:var(--orange-deep);font-weight:600}
}
@media (max-width:720px){
  .kpis{gap:12px}
  .kpi{padding:14px;gap:10px;min-height:0;flex-direction:column;align-items:flex-start}
  .kpi .ico{width:36px;height:36px}
  .kpi .h{display:none}
  .rows .r{grid-template-columns:1fr}
  .rows .r .rt{text-align:left;padding-left:48px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .rows .r .rt .pill{margin:0}
  .mbar .mt{white-space:nowrap}
  .thead{display:none}
  .trow{grid-template-columns:minmax(0,1fr);gap:6px;padding:13px 18px}
  .trow>.cell,.trow>.c-st{display:none}
  .trow>.c-meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding-left:48px;white-space:normal}
  #chips{flex-wrap:nowrap;overflow-x:auto;width:100%;scrollbar-width:none;padding-bottom:2px}
  .chip{white-space:nowrap}
  .filters{display:grid;grid-template-columns:1fr 1fr}
  .filters select{width:100%}
  .filters .sp{display:none}
  .filters select[data-k=s],.filters .clear{grid-column:1/-1}
  .ch,.pad,.tbody,.dhead{padding-left:18px;padding-right:18px}
  .rows .r,.agenda .it,.mini .r,table.t td,table.t th,.filters{padding-left:18px;padding-right:18px}
  .kv{grid-template-columns:1fr;gap:0}.kv dd{margin-bottom:10px}
  .dhead .acts{width:100%}
  .tabs{padding:0 8px}
  .tabs a.tech{margin-left:0}
}
@media (min-width:721px){.c-meta{display:none}}

joys both designing user experiences and building them.\nThis isn't a traditional UI designer role, nor is it purely a frontend engineering position. You'll own the experience from concept to implementation—designing intuitive interfaces, creating polished interactions, and developing production-ready front-end components that bring those experiences to life.\nYou'll work closely with product, engineering, and AI creatives teams to build fast, elegant, and highly engaging user experiences for a consumer AI product.\n\nWhat You'll Do\n* Design intuitive user flows, wireframes, mockups, and high-fidelity interfaces.\n* Translate designs into responsive, production-ready front-end experiences.\n* Build and maintain reusable UI components and contribute to our design system.\n* Improve user experience by refining interactions, animations, accessibility, and visual consistency.\n* Collaborate with product and engineering teams to rapidly prototype and iterate on new features.\n* Help shape the overall product experience through thoughtful design decisions and technical implementation.\n* Stay up to date with modern UI/UX trends, front-end technologies, and AI product experiences.\n\nWhat We're Looking For\n* 5+ years of experience in UI/UX design, frontend engineering, or Design Engineering.\n* Strong portfolio showcasing both product design and shipped web experiences.\n* Proficiency with Figma for UI/UX design and prototyping.\n* Strong frontend development skills using: HTML5, CSS3, JavaScript/TypeScript and React (preferred) or another modern frontend framework.\n* Deep understanding of responsive design, accessibility, and modern web standards.\n* Experience creating reusable UI components and design systems.\n* Strong eye for typography, spacing, visual hierarchy, and interaction design.\n* Comfortable working in a fast-paced startup environment with rapid iteration.\n\nNice to Have\n* Experience with motion design and micro-interactions.\n* Familiarity with Tailwind CSS or modern CSS frameworks.\n* Experience building AI-powered products or consumer-facing SaaS applications.\n* Knowledge of animation libraries such as Framer Motion or GSAP.\n* Understanding of usability testing and UX research.\n\nWhat Makes You Successful\n* You care equally about how a product looks and how it works.\n* You can move from an idea to a polished implementation without extensive handoffs.\n* You enjoy solving UX problems with both design thinking and code.\n* You thrive in fast-moving environments where shipping, learning, and iterating matter more than perfection.\n* You're proactive, collaborative, and comfortable owning projects from start to finish.\n\nWhy Join Aurify?\n* Build one of the fastest-growing AI consumer products.\n* Work with cutting-edge AI technologies in image and video generation.\n* Have a direct impact on product direction and user experience.\n* Collaborate with a small, highly talented team that values speed, ownership, and craftsmanship.\n* Shape experiences used by creators around the world.\n\nLearn More About Aurify\nBefore applying, we encourage you to explore our platform and learn more about what we're building.\nWebsite: https://aurify.com\n\nHow to Apply\nSend your resume, cover letter, and portfolio (if available) to careers@aurify.com. Email subject line format: UI/UX Designer – [Your Name]\n\n[NOTE] No location rule, timezone requirement, employment arrangement or compensation stated anywhere in the posting. No posting URL supplied. Application channel is EMAIL.\n","test":null,"co":{"company_id":"CO-0001","name":"Aurify","website":"https://aurify.com","country":"UNKNOWN","size":"UNKNOWN","type":"UNKNOWN","hires_from_brazil_signal":"UNKNOWN","contract_model_known":"UNKNOWN","relationship_status":"NO-CONTACT","first_seen_date":"2026-09-21","legitimacy_checked":"NOT-REQUESTED","research_notes":"","do_not_reapply_before":"","block_reason":"","notes":""},"others":[],"ct":[],"iv":[],"out":[]}</script>

 with organizations connected to the NFL, NBA, NHL, Marriott, Hyatt, and Live Nation 🏟️\n\nWe're looking for a designer who can help shape how Listo looks and communicates as we grow.\n\n✅ 3+ years of graphic design experience\n✅ Experience in digital design, branding & visual content\n✅ SaaS or tech experience preferred\n✅ Fluent English (B2+ required)\n✅ Strong portfolio & visual judgment\n\n📍 Fully remote, open across Latin America\n\n👉 Apply here: https://lnkd.in/dn8fNEkv\n\n\n[VERBATIM — JOB PAGE] About the job\nPicture 50,000 fans in a stadium, a hotel lobby full of guests, an arena running at full speed. Listo is the platform making it all click, and our clients include venues used by NFL, NBA, and NHL teams, plus brands like Marriott, Hyatt, and Live Nation.\n\nWe're growing our design team and looking for someone with strong visual instincts to help shape how Listo looks across every touchpoint. Your work will land in front of serious enterprise buyers, so it needs to look the part.\n\nWHAT YOU'LL DO\n\n* Designing our website, landing pages, sales decks, and case studies\n* Creating LinkedIn content that's polished enough to stop a scroll\n* Building assets for webinars, events, and trade shows\n* Turning product features into visuals people actually get\n* Shaping Listo's brand identity as we grow\n\nWHAT WE'RE LOOKING FOR\n\n* 3+ years of design experience, ideally in B2B SaaS or tech\n* A portfolio with range: web, decks, social, and brand work\n* Fluency in Figma and Adobe Creative Suite\n* Fluent, professional English, spoken and written, for daily collaboration with US-based marketing and leadership\n* An eye for clean, credible design that lands with executive audiences\n\nWHY YOU'LL LIKE IT HERE\n\n* Work with some of the most recognizable names in sports, hospitality, and entertainment\n* Remote-first and genuinely flexible\n* Direct line to leadership, real say in how the brand looks\n\nSound like you? Send your resume and a portfolio link. We're especially excited to see B2B or enterprise-facing work. 👋\n\nWe may use artificial intelligence (AI) tools to support parts of the hiring process, such as reviewing applications, analyzing resumes, or assessing responses and identifying potential inconsistencies or verification signals in application materials based on available information. These tools assist our recruitment team but do not replace human judgment. Final hiring decisions are ultimately made by humans. If you would like more information about how your data is processed, please contact us.\n\nArgentina · 1 month ago · Over 100 people clicked apply\nResponses managed off LinkedIn\n\n[NOTE] Arrangement (contractor/employee), weekly hours, compensation and timezone not stated. Seniority not labelled; 3+ years asked.\n","test":null,"co":{"company_id":"CO-0003","name":"Listo","website":"UNKNOWN","country":"UNKNOWN","size":"UNKNOWN","type":"B2B SaaS — real-time coordination platform for stadiums, arenas, hotels and major venues (per posting)","hires_from_brazil_signal":"LIKELY","contract_model_known":"UNKNOWN","relationship_status":"APPLIED","first_seen_date":"2026-09-24","legitimacy_checked":"NOT-REQUESTED","research_notes":"","do_not_reapply_before":"","block_reason":"","notes":"Posting says 'Fully remote, open across Latin America'; LinkedIn listing location shows 'Argentina'. Clients per posting: venues used by NFL, NBA, NHL teams; Marriott, Hyatt, Live Nation."},"others":[],"ct":[],"iv":[],"out":[]}</script>

y":"CLAUDE","k":"a"},{"event_id":"EV-00033","timestamp":"2026-09-24 13:06","entity_type":"OPPORTUNITY","entity_id":"OPP-0004","event_type":"DECIDED","summary":"DO-NOT-APPLY confirmed, now as a fit decision: editorial textbook production well below his level and outside brand/web. Status stays DISCARDED.","detail_verbatim":"","source_of_info":"P1 re-evaluation after EV-00031","old_value":"reason: ARRANGEMENT-NOT-ACCEPTED (CLT)","new_value":"reason: fit","logged_by":"CLAUDE","k":"a"}],"post":"[VERBATIM — LINKEDIN JOB PAGE] Bernoulli Educação\nDESIGNER\nBrazil · Reposted 23 hours ago · Over 100 people clicked apply\nResponses managed off LinkedIn\nRemote\nFull-time\n\nAbout the job\nSe o olho brilha, vem ser Bernoulli\n\nSomos feitos de pessoas que acreditam no poder transformador da educação. Gente criativa, determinada e que gosta de aprender. Profissionais que enxergam os desafios como oportunidades para inovar, gerar ideias, soluções e impulsionar o conhecimento.\n\nTudo isso em um ambiente onde as diferenças se encontram, dialogam e trabalham em equipe. Um ambiente acolhedor, plural e dinâmico, onde as pessoas são motivadas a se desenvolver para evoluir, prosperar e alcançar seus objetivos.\n\nSe seu olho brilha para novos desafios e você quer fazer parte de uma cultura em transformação, em uma empresa que não para de crescer, venha ser Bernoulli!\n\nVenha revolucionar a educação junto com a gente!\n\nResponsabilidades e atribuições\n\n* Criar manuais padrões para os projetos - Visar o padrão e a qualidade do Bernoulli.\n* Equações e fórmulas - Desenvolver e aplicar equações e frações de acordo com padrões técnicos de cada disciplina de exata (FIS, QUI, MAT e BIO), usando a ferramenta disponível (software MathType) afim de produzir as equações necessárias, padronizando-as para cada segmento.\n* Conferir cada material/peça digital, se responsabilizando pela qualidade e funcionamento da interatividade.\n* Criar a proposta visual das peças digitais (books, sites, questões de imagem e vídeo resolução) distribuindo e organizando os elementos gráficos no espaço, como textos, fotos, ilustrações, gráficos, infográficos, respeitando os padrões do projeto gráfico e as especificações da identidade visual, visando a legibilidade, a organização e a atratividade visual do book\n* Realizar edição de fotos melhorando a qualidade técnica das imagens, desenvolver gráficos e tabelas padronizando visualmente e tecnicamente elementos gráficos, a fim de garantir e proporcionar uma boa legibilidade do material impresso para o entendimento do aluno/professor.\n* Realizar transcrição textos que são disponibilizados como imagem, tornando-o editável, visando promover uma melhor leitura do conteúdo, afim de garantir a aprendizagem do aluno e unidade visual e estética do material.\n* Analisar diretrizes e documentos das áreas de cada publicação, realizar montagem, diagramação e correções de apontamentos da revisão, do analista pedagógico e do autor, construindo páginas criativas, ajustando-as de acordo com a proposta visual de cada publicação, afim de despertar o interesse do aluno, garantir padrões editoriais e pedagógicos e a qualidade da aprendizagem por meio da organização visual da publicação.\n* Projetar páginas para cada publicação, analisando a melhor composição para cada segmento / coleção, organizando os elementos gráficos, como textos, fotos, ilustrações, gráficos, mapas e infográfico, atentando-se aos padrões técnicos do projeto gráfico de cada coleção, garantindo legibilidade, a organização e atratividade visual de cada página.\n\nRequisitos e qualificações\n\n* CLT, Híbrido (candidatos de BH e região) ou Remoto.\n* Carga horária: 44h semanais, de segunda a quinta-feira das 08h às 18h e sexta-feira das 08h às 17h.\n\nInformações adicionais\n[Benefícios listados: plano de saúde, plano odontológico, seguro de vida, VA/VR, café/lanche nas unidades, vale-transporte, Total Pass e Wellhub, day off no aniversário, Universidade Corporativa, programa gestantes, orientação psicológica/jurídica/financeira/social, presente de casamento, Duo Gourmet, Clube de Vantagens, políticas de home office para mães e pais em regime híbrido.]\n\n[Aviso de proteção de dados: candidatura via plataforma Gupy; política de privacidade https://www.bernoulli.com.br/bernoulli-educacao/info/pol%C3%ADtica-de-privacidade/]\n\n[NOTE] Benefícios list and data-protection notice condensed by the agent (bracketed); all role, requirement and arrangement text above is verbatim. Compensation not posted. Apply channel: Gupy.\n","test":null,"co":{"company_id":"CO-0004","name":"Bernoulli Educação","website":"https://www.bernoulli.com.br","country":"BR","size":"UNKNOWN","type":"Education / educational publishing","hires_from_brazil_signal":"CONFIRMED","contract_model_known":"CLT","relationship_status":"NO-CONTACT","first_seen_date":"2026-09-24","legitimacy_checked":"NOT-REQUESTED","research_notes":"","do_not_reapply_before":"","block_reason":"","notes":"Designer role posted as CLT, 44h/week, hybrid (BH) or remote. Website taken from the privacy-policy URL in the posting."},"others":[],"ct":[],"iv":[],"out":[]}</script>

er_language":"PT","is_reusable":"YES","standard_answer_id":"","date":"2026-09-25","notes":"POR-001. Question wording not captured verbatim."}],"ev":[{"event_id":"EV-00034","timestamp":"2026-09-25 06:45","entity_type":"COMPANY","entity_id":"CO-0006","event_type":"CREATED","summary":"Company record created for Vinta Software (OPP-0006).","detail_verbatim":"","source_of_info":"Posting text supplied by Mathews in chat","old_value":"","new_value":"","logged_by":"CLAUDE","k":"a"},{"event_id":"EV-00035","timestamp":"2026-09-25 06:45","entity_type":"OPPORTUNITY","entity_id":"OPP-0006","event_type":"EVALUATED","summary":"Vinta Software Senior Marketing Web Designer evaluated under P1. Track INTL / REPLACE. Gates PASS (remote contractor, USD, Brazil). Priority A.","detail_verbatim":"","source_of_info":"Posting text supplied by Mathews in chat","old_value":"","new_value":"","logged_by":"CLAUDE","k":"a"},{"event_id":"EV-00036","timestamp":"2026-09-25 06:45","entity_type":"OPPORTUNITY","entity_id":"OPP-0006","event_type":"DECIDED","summary":"APPLY. At-level scope; frame the AI-coding-agent requirement only through tools he actually uses. Status EVALUATED.","detail_verbatim":"","source_of_info":"P1 evaluation, this session","old_value":"","new_value":"EVALUATED","logged_by":"CLAUDE","k":"a"},{"event_id":"EV-00041","timestamp":"2026-09-25 07:45","entity_type":"APPLICATION","entity_id":"APP-0004","event_type":"SUBMITTED","summary":"APP-0004 submitted to Vinta Software via application form. Resume CV-EN-003 (file Mathews-Esaki-Resume-Senior-Marketing-Web-Designer.pdf), portfolio POR-001, no cover letter, salary not asked. Answers ANS-0009 to ANS-0013 logged; Q1 choice pending confirmation. Opportunity status set to APPLIED.","detail_verbatim":"Ok, marquei a 4ª. Depois apenas pediram o link do portfolio (coloquei o site). E antes dessas perguntas eu preenchi nome completo, email, linkedin e anexei o currículo.","source_of_info":"Stated by Mathews in chat","old_value":"EVALUATED","new_value":"APPLIED","logged_by":"CLAUDE","k":"p"},{"event_id":"EV-00042","timestamp":"2026-09-25 07:45","entity_type":"APPLICATION","entity_id":"APP-0004","event_type":"NOTE","summary":"Automated submission confirmation shown on screen after the Vinta form. Automated acknowledgement: not a reply, first_reply_date stays empty, status stays SUBMITTED.","detail_verbatim":"Inscrição feita com sucesso!\nVocê se inscreveu na vaga Senior Marketing Web Designer - Remote - 2,4–3,1k USD. Em breve iremos entrar em contato.","source_of_info":"Confirmation screen text pasted by Mathews in chat","old_value":"","new_value":"","logged_by":"CLAUDE","k":"p"},{"event_id":"EV-00043","timestamp":"2026-09-25 07:58","entity_type":"APPLICATION","entity_id":"APP-0004","event_type":"NOTE","summary":"Q1 answer of the Vinta form confirmed by Mathews and logged as ANS-0014 (5th option). All five form answers now recorded.","detail_verbatim":"Pode salvar a resposta da primeira pergunta também, eu marquei a opção que sugeriu","source_of_info":"Stated by Mathews in chat","old_value":"Q1 pending","new_value":"ANS-0014","logged_by":"CLAUDE","k":"p"}],"post":"[VERBATIM — LINKEDIN JOB PAGE] Vinta Software\nSenior Marketing Web Designer\nBrazil · 12 hours ago · 18 people clicked apply\n\nAbout the job\n\nWho we are\nVinta is a product engineering company that helps US startups build and scale digital products. For over 13 years, we've partnered with ambitious companies by providing dedicated product teams composed of senior engineers, designers, product managers, and engineering managers.\nWe're now expanding our presence in healthcare while continuing to build long-term partnerships with clients who value engineering excellence, collaboration, and product thinking.\nAt Vinta, we believe great products start with great people. That's why we've built a culture centered on trust, continuous learning, ownership, and flexibility, creating an environment where talented professionals can do their best work.\nTo learn more, visit our website and our Glassdoor page\n\nSenior Marketing Web Designer\nThis is a remote contractor position for our US-based company. We're looking for a Senior Marketing Web Designer to join our Marketing team and help drive Vinta's growth.\nYou'll move forward the design and production of web pages and visual materials that help Vinta communicate its expertise, generate opportunities, and support sales. Your main focus will be marketing websites and landing pages, alongside campaign assets and sales materials.\nWe're looking for a senior designer who combines strong visual judgment with hands-on use of AI. You should be able to take an open-ended brief, explore directions quickly, and turn the strongest one into a polished, responsive deliverable that is ready to publish.\nIf you're an experienced designer in Marketing and Growth, use AI tools like Claude Design and Code, ChatGPT or Codex as part of your regular workflow, and you want to build systems that scale instead of producing one-off assets forever, we'd love to hear from you.\n\nScope of work\n\n* Design, build, and improve landing pages, service pages, case studies, and other pages for marketing and sales;\n* Use AI throughout your workflow to research references, explore concepts, build pages and assets, and refine the final result;\n* Make routine website changes yourself using AI coding tools, code, or visual website builders. You will collaborate with engineering when changes require deeper technical work;\n* Create visual assets for campaigns, ads, social media, presentations, and sales materials;\n* Maintain and evolve Vinta's visual identity across channels;\n* Work with the Expansion team on growth experiments, using results and feedback to improve pages and creative;\n* Manage concurrent requests, share early versions, make sound scope decisions, and keep projects moving;\n* Build reusable components, templates, and workflows that help the team produce consistent work efficiently.\n\nRequirements\n\n* 5+ years of experience in web and marketing design, with a portfolio that includes published pages and high-quality campaign work;\n* Strong understanding of typography, composition, visual hierarchy, spacing, color, and detail;\n* Proven hacker mind using AI coding agents, such as Claude Code or Codex, to help turn designs into working deliverables. We expect you to own and improve what the tools produce;\n* Experience designing and checking responsive pages, with attention to conversion best practices, accessibility, SEO, and performance;\n* Proficiency with Figma, Adobe Creative Suite, or comparable tools;\n* The judgment and ownership to set a visual direction, handle ambiguous briefs, incorporate feedback, and deliver without constant supervision;\n* The ability to collaborate across teams and balance multiple priorities while maintaining quality;\n* English fluency;\n\nNice to Have\n\n* Experience at a digital product consultancy, technology services firm, or B2B technology company;\n* Familiarity with technical services or complex software sold through long sales cycles.\n* Experience creating brand guidelines or design systems used by people outside the design team;\n* Working knowledge of HTML, CSS, and JavaScript, sufficient to edit and iterate on website templates independently;\n* Motion design, animation, or image and video production for campaigns.\n\nCompensation & Terms\n\n* Monthly pay between $2,400–$3,100 USD, contractor engagement\n* Yearly bonus based on performance payment\n* 22 business days of agreed time off per year (recesso)\n\n[NOTE] LinkedIn tracking URLs behind \"website\" and \"Glassdoor\" removed; website is vintasoftware.com. Weekly hours not stated; monthly pay and 22 days off imply but do not state full-time. Exclusivity not stated. Timezone not stated.\n","test":null,"co":{"company_id":"CO-0006","name":"Vinta Software","website":"https://www.vintasoftware.com","country":"US (per posting: 'our US-based company')","size":"UNKNOWN","type":"Product engineering company / dedicated product teams for US startups (per posting)","hires_from_brazil_signal":"CONFIRMED","contract_model_known":"CONTRACTOR","relationship_status":"APPLIED","first_seen_date":"2026-09-25","legitimacy_checked":"NOT-REQUESTED","research_notes":"","do_not_reapply_before":"","block_reason":"","notes":"LinkedIn listing location: Brazil. Posting states remote contractor, USD monthly pay."},"others":[],"ct":[],"iv":[],"out":[]}</script>

nals through Wellhub and TotalPass.\n* Profit Sharing and Results Participation (PLR).\n* Life insurance.\n* Access to a continuous learning platform.\n* Discount club and partner benefits.\n* Free online resources focused on physical, mental, and overall well-being.\n* Pregnancy and responsible parenting course.\n* Partnerships with online learning platforms.\n* Access to language learning resources.\n* Opportunities for continuous professional development and skills growth.\n* Inclusive work environment with dedicated health, well-being, and inclusion support.\n\nHow Jobgether Works\nWe use an AI-powered matching process to ensure your application is reviewed quickly, objectively, and fairly against the role's core requirements. Our system identifies the top-fitting candidates, and this shortlist is then shared directly with the hiring company. The final decision and next steps (interviews, assessments) are managed by their internal team.\n\nWe appreciate your interest and wish you the best!\n\nData Privacy Notice: By submitting your application, you acknowledge that Jobgether will process your personal data to evaluate your candidacy and share relevant information with the hiring employer. This processing is based on legitimate interest and pre-contractual measures under applicable data protection laws (including GDPR). You may exercise your rights (access, rectification, erasure, objection) at any time.\n\nWe may use artificial intelligence (AI) tools to support parts of the hiring process, such as reviewing applications, analyzing resumes, or assessing responses and identifying potential inconsistencies or verification signals in application materials based on available information. These tools assist our recruitment team but do not replace human judgment. Final hiring decisions are ultimately made by humans. If you would like more information about how your data is processed, please contact us.\n\n[NOTE] Employer identity never named on this posting — Jobgether is the intermediary managing the process. Arrangement (PJ/CLT), timezone requirement and compensation not stated anywhere. Benefits list (health/dental insurance, PLR, meal allowance, childcare, extended paternity leave) is typical of a CLT package in Brazil but the posting never states the employment model. Employer later identified as CI&T — see OPP-0009 and CO-0007 CORRECTION (EV-00056).\n","test":null,"co":{"company_id":"CO-0007","name":"CI&T","website":"https://ciandt.com","country":"BR","size":"~8,000 employees across 25+ countries (per posting)","type":"Technology / AI-native execution and digital transformation consultancy (per posting: AI Deployment, application modernization, Data & AI, Martech, business strategy; 30 years of experience)","hires_from_brazil_signal":"CONFIRMED","contract_model_known":"UNKNOWN","relationship_status":"NO-CONTACT","first_seen_date":"2026-09-28","legitimacy_checked":"NOT-REQUESTED","research_notes":"","do_not_reapply_before":"","block_reason":"","notes":"Originally encountered as OPP-0007, posted anonymously via Jobgether ('undisclosed partner company'). Identity revealed 2026-09-28 when Mathews found a near-identical posting (OPP-0009) made directly by CI&T on LinkedIn: same accountabilities, qualifications and benefits list almost verbatim. Company record kept as CO-0007 (not duplicated); name updated from 'UNDISCLOSED — partner company (via Jobgether)' to 'CI&T'. Neither posting was applied to (video editing/animation requirement, both instances)."},"others":["OPP-0009"],"ct":[],"iv":[],"out":[]}</script>

n technological transformation, we accelerate innovation with expertise in Agentic SDLC, Application modernization, Data & AI, Martech and Business strategy.\n\nWe are 8,000 CI&Ters across more than 25 countries, collaborating to build solutions with real impact. AI is already part of how we work, evolve, and innovate every day.\n\nWe are looking for a creative and talented Graphic Designer to join our team. The ideal candidate will be responsible for designing and creating a variety of visual materials including presentations (PPTs), videos, communication pieces, email templates, logos, banners, folders, and any other visual content we may need. Additionally, the designer will create components for the mobile platform to be utilized by our UX and Frontend teams.\n\nResponsibilities:\n\n* Design and produce high-quality visual materials such as PPT presentations, videos, communication pieces, email templates, logos, banners, and folders\n* Collaborate with UX and Frontend teams to create components for the MyApps platform, ensuring cohesive and user-friendly designs\n* Conceptualize and execute designs that align with the company's branding and marketing strategies\n* Manage multiple projects simultaneously while meeting deadlines and maintaining high-quality standards\n* Stay updated with industry trends and tools to bring fresh ideas and innovative designs to the team\n\nQualifications:\n\n* Advanced English\n* Proven experience as a Graphic Designer or in a related role\n* Proficiency in design software such as Adobe Creative Suite (Photoshop, Illustrator, InDesign, After Effects, etc.)\n* Strong portfolio showcasing a range of design projects and skills\n* Excellent communication and collaboration skills\n* Ability to work independently and as part of a team, with attention to detail\n* Experience in video editing and animation\n* Knowledge of web design principles and UX/UI best practices\n* Familiarity with HTML/CSS is a plus\n\nOur benefits:\n\n-Health and dental insurance\n-Meal and food allowance\n-Childcare assistance\n-Extended paternity leave\n-Partnership with gyms and health and wellness professionals via Wellhub (Gympass) TotalPass\n-Profit Sharing and Results Participation (PLR)\n-Life insurance\n-Continuous learning platform (CI&T University)\n-Discount club\n-Free online platform dedicated to physical, mental, and overall well-being\n-Pregnancy and responsible parenting course\n-Partnerships with online learning platforms\n-Language learning platform\nAnd many more!\nMore details about our benefits here: https://ciandt.com/br/pt-br/carreiras\n\n[Disability-inclusion note condensed by the agent: CI&T states that a candidate with a disability should present their assessment during the selection process, with a dedicated Health and Well-being team and inclusion specialists supporting the process.]\n\nBenefits found in job post: Dental insurance, Medical insurance, Paid paternity leave\n\n[NOTE] Employer named directly (CI&T), posted by CI&T itself, not via an intermediary. Arrangement (PJ/CLT), timezone requirement and compensation not stated. Text — accountabilities, requirements and benefits list — is near-identical to OPP-0007 (posted anonymously via Jobgether), strongly indicating this is the same underlying role with the employer now disclosed. See CO-0007 CORRECTION (EV-00056).\n","test":null,"co":{"company_id":"CO-0007","name":"CI&T","website":"https://ciandt.com","country":"BR","size":"~8,000 employees across 25+ countries (per posting)","type":"Technology / AI-native execution and digital transformation consultancy (per posting: AI Deployment, application modernization, Data & AI, Martech, business strategy; 30 years of experience)","hires_from_brazil_signal":"CONFIRMED","contract_model_known":"UNKNOWN","relationship_status":"NO-CONTACT","first_seen_date":"2026-09-28","legitimacy_checked":"NOT-REQUESTED","research_notes":"","do_not_reapply_before":"","block_reason":"","notes":"Originally encountered as <script type="application/json" id="d:OPP-0010">{"o":{"opportunity_id":"OPP-0010","date_found":"2026-09-28","track":"BR-SUBSTITUIR","intended_outcome":"REPLACE","source":"LINKEDIN-JOBS","source_detail":"LinkedIn","search_method":"Found by Mathews on LinkedIn Jobs; posting page text pasted into the system","company_id":"CO-0009","company_name":"Boldr","role_title":"Senior Graphic Designer / Brand & Creative Lead","seniority_posted":"SENIOR","arrangement_posted":"UNCLEAR","location_rule":"SAO-PAULO-CITY-ONLY","timezone_requirement":"NOT-POSTED","comp_posted_min":"","comp_posted_max":"","comp_currency":"","comp_period":"NOT-POSTED","posting_url":"https://www.linkedin.com/jobs/view/4470553672/","posting_snapshot":"materials/postings/OPP-0010.md","gate_result":"FAIL","gate_failed_reason":"LOCATION-MISMATCH","compatibility_verdict":"N/A","fit_notes":"The posting states location eligibility twice, unambiguously: 'This role is open only to candidates currently based in São Paulo, Brazil' and 'Candidates must currently be based in São Paulo and be available to attend occasional team activities at our São Paulo office.' This is not a Brazil-wide remote rule — it is a city-specific residency requirement with an occasional in-person component. Mathews is based in Brasília, not São Paulo, so this is a hard geographic disqualifier independent of fit. Fit itself would otherwise have been strong (brand identity, creative direction, email design, landing pages/websites, packaging, campaigns, sales materials — squarely his scope and level, Senior/Creative-Lead-appropriate, no below-level framing needed), but the location gate fails before fit is reached, so fit was not evaluated further.","priority":"C","decision":"DO-NOT-APPLY","decision_date":"2026-09-28","decision_rationale":"Hard gate failure: posting restricts eligibility to candidates currently based in São Paulo city, with occasional in-person office attendance. Mathews is based in Brasília. Nothing in his record suggests relocation or a São Paulo address, so this is a straightforward location gate fail, not a judgment call.","status":"DISCARDED","application_id":"","notes":"Would otherwise have been a strong, at-level fit (Senior Graphic Designer / Brand & Creative Lead, full ownership of visual creative direction) — worth noting only as a signal of the kind of role to keep looking for, not as a reason to revisit this specific posting.","display_company":"Boldr","display_summary":"Senior Graphic Designer / Brand & Creative Lead — energia residencial (HVAC, EUA). Vaga forte no papel, mas exige estar baseado em São Paulo (cidade), com presença ocasional no escritório. Não aplicado por localização.","display_points":["Exige residir em São Paulo (cidade), não só Brasil — você está em Brasília","Presença ocasional no escritório de SP é exigida","Escopo e nível seriam um bom encaixe, se a localização não desqualificasse"]},"a":null,"corr":[],"ans":[],"ev":[{"event_id":"EV-00060","timestamp":"2026-09-28 00:20","entity_type":"COMPANY","entity_id":"CO-0009","event_type":"CREATED","summary":"Company record created for Boldr (OPP-0010), a residential energy management technology company starting with the U.S. HVAC market.","detail_verbatim":"","source_of_info":"Posting text supplied by Mathews in chat","old_value":"","new_value":"","logged_by":"CLAUDE","k":"a"},{"event_id":"EV-00061","timestamp":"2026-09-28 00:20","entity_type":"OPPORTUNITY","entity_id":"OPP-0010","event_type":"EVALUATED","summary":"Senior Graphic Designer / Brand & Creative Lead (Boldr) evaluated under P1 using the fast chat format. Gate FAIL: posting explicitly restricts eligibility to candidates currently based in São Paulo city, with occasional in-person office attendance — Mathews is based in Brasília. gate_result=FAIL, gate_failed_reason=LOCATION-MISMATCH. Fit not evaluated further once the hard gate failed (fit_notes records that it would otherwise likely have been strong and at-level).","detail_verbatim":"","source_of_info":"Posting text supplied by Mathews in chat","old_value":"","new_value":"","logged_by":"CLAUDE","k":"a"},{"event_id":"EV-00062","timestamp":"2026-09-28 00:20","entity_type":"OPPORTUNITY","entity_id":"OPP-0010","event_type":"DECIDED","summary":"DO-NOT-APPLY. Hard location gate failure (São Paulo city residency required, with occasional office attendance); Mathews is based in Brasília. Status DISCARDED. No application produced.","detail_verbatim":"","source_of_info":"P1 evaluation, this session","old_value":"","new_value":"DISCARDED","logged_by":"CLAUDE","k":"a"}],"post":"[VERBATIM — LINKEDIN JOB PAGE] Boldr\nSenior Graphic Designer / Brand & Creative Lead\nSão Paulo, Brazil · 1 day ago · Over 100 applicants\nPromoted by hirer · No response insights available yet\n\nAbout the job\n\nLocation requirement: This role is open only to candidates currently based in São Paulo, Brazil.\n\nAbout Boldr\nBoldr is building the future of residential energy management. Our mission is to help homeowners connect and optimize the energy assets in their homes, reducing energy consumption and lowering utility bills. We are starting with the largest residential energy market in the U.S. — HVAC.\n\nAbout the Role\nWe're looking for an experienced graphic designer with an exceptional creative eye and a strong understanding of branding to help shape how Boldr looks and feels across every customer touchpoint.\nThis is a hands-on role with ownership of visual creative direction. You'll develop concepts, establish a clear visual approach, and bring that direction to life through branding, email design, packaging, landing pages, websites, marketing campaigns, and sales materials.\nWe're looking for someone who can take an open-ended brief, bring thoughtful ideas to the table, and turn them into polished, distinctive designs. You should have a strong instinct for typography, layout, color, imagery, and the details that make a brand feel cohesive and recognizable.\nYou'll work across teams to ensure our creative work communicates clearly, reflects our brand, and supports both customer needs and business goals.\n\nWhat You'll Do\n• Brand identity and creative direction: Evolve Boldr's visual identity, develop creative concepts and moodboards, and establish a consistent direction across digital and physical materials.\n• Brand guidelines and templates: Build and maintain practical brand guidelines, reusable design assets, and templates that help teams produce consistent work.\n• Email design: Design marketing campaigns, newsletters, product announcements, and customer lifecycle emails with clear hierarchy, strong visual storytelling, and mobile-friendly layouts.\n• Landing pages and websites: Design landing pages, website pages, and product pages in Figma, from initial layouts to polished desktop and mobile designs ready for development.\n• Packaging and print: Design product packaging, labels, inserts, quick-start guides, brochures, and other printed materials, preparing production-ready files and coordinating with suppliers where needed.\n• Campaigns and product launches: Develop visual concepts for launches and campaigns, translating a central idea into cohesive assets across email, web, social, and advertising.\n• Advertising and social creative: Create static ads, carousels, social graphics, and campaign variations that balance brand quality with marketing objectives.\n• Sales and partner materials: Design presentations, product one-pagers, sales collateral, and co-branded materials for channel partners.\n• Product storytelling: Turn technical information and product benefits into clear visuals, diagrams, infographics, and educational content.\n• Art direction: Guide photography, product imagery, illustration, and other creative assets, collaborating with video editors, photographers, and external creatives as needed.\n• Project ownership: Manage projects from brief through final delivery, present your creative rationale, incorporate feedback, and maintain a high standard of quality across multiple priorities.\n\nSkills & Experience\n• 5+ years of professional experience in graphic design, brand design, or a related creative role.\n• A strong portfolio demonstrating excellent visual judgment and cohesive branding across multiple formats.\n• Proven ability to develop original creative concepts and carry them through to finished work.\n• Strong fundamentals in typography, composition, color, visual hierarchy, and image selection.\n• Advanced proficiency in Figma and Adobe Creative Cloud, particularly Illustrator, Photoshop, and InDesign.\n• Experience designing emails, responsive websites, and landing pages, with an understanding of usability, accessibility, and conversion-focused design.\n• Experience designing packaging and printed materials, including familiarity with dielines, bleeds, color specifications, and print production.\n• Ability to translate complex products or ideas into simple, compelling visual communication.\n• Confidence in making creative decisions, explaining your thinking, and providing constructive design feedback.\n• Strong attention to detail, organization, and ownership of deadlines.\n• Comfortable working independently and collaborating with stakeholders across different functions.\n• Professional or native-level English proficiency. All communication and content will be in English.\n\nBonus Skills & Experience\nWe'd especially like to hear from candidates who also have experience with:\n• Experience within the trades/HVAC industry and marketing to HVAC business and contractors.\n• Consumer technology, connected devices, or physical product brands.\n• Art directing product photography, lifestyle shoots, or 3D renders.\n• Motion graphics and simple animation.\n• Building website pages with product focus\n• Implementing email designs in Klaviyo, HubSpot, or similar tools.\n• Performance marketing creative and using campaign results to improve design.\n• AI-powered creative tools for concept exploration, asset creation, and production workflows, while maintaining originality and quality.\n\nWhat Success Looks Like\nBoldr's brand feels cohesive, distinctive, and thoughtfully designed across our website, emails, packaging, campaigns, and partner materials.\nYou become a trusted creative partner who can take a business objective, propose a strong visual direction, and deliver excellent work with increasing independence. The systems and templates you create also make it easier for the wider team to maintain that standard as we grow.\n\nRemote Work\nThis position is remote within São Paulo, Brazil. Candidates must currently be based in São Paulo and be available to attend occasional team activities at our São Paulo office.\nYou should be comfortable working independently, communicating asynchronously, managing deadlines, and collaborating with team members across different functions.\n\nHow to Apply\nPlease submit:\n• Your CV or resume.\n• A portfolio link included in your CV or resume.\nWe're particularly interested in seeing a brand identity carried across several touchpoints, alongside examples of email design, packaging, and websites or landing pages.\nApplications without a portfolio will not be considered.\n\n[NOTE] Arrangement (PJ/CLT/EOR) and compensation not stated. 'Remote' here means remote-within-São-Paulo-only, with occasional in-person office attendance — not remote-anywhere-in-Brazil.\n","test":null,"co":{"company_id":"CO-0009","name":"Boldr","website":"UNKNOWN","country":"US (per posting: starting with the U.S. residential HVAC/energy market)","size":"UNKNOWN","type":"Residential energy management technology (per posting: helps homeowners connect and optimize home energy assets, starting with HVAC)","hires_from_brazil_signal":"CONFIRMED, but restricted to São Paulo city only","contract_model_known":"UNKNOWN","relationship_status":"NO-CONTACT","first_seen_date":"2026-09-28","legitimacy_checked":"NOT-REQUESTED","research_notes":"","do_not_reapply_before":"","block_reason":"","notes":"Posting explicitly restricts eligibility to candidates currently based in São Paulo city, with occasional in-person attendance at the São Paulo office. Mathews is based in Brasília, not São Paulo — disqualifying on location alone, independent of fit."},"others":[],"ct":[],"iv":[],"out":[]}</script>

ol for building and publishing sites. I haven't worked with Webflow professionally yet, and I'd rather be upfront about that. I'm confident I'd ramp up quickly given my Framer background.","answer_language":"EN","is_reusable":"YES","standard_answer_id":"","date":"2026-10-04","notes":"Sent 2026-10-05 21:04 BRT. Supersedes in practice the 'Yes' of ANS-0032, which stays frozen as submitted."}],"ev":[{"event_id":"EV-00085","timestamp":"2026-09-29 11:20","entity_type":"COMPANY","entity_id":"CO-0012","event_type":"CREATED","summary":"Company record created for Foundey, formerly Uitify (OPP-0013), a US-based embedded product design partner for early-stage SaaS/AI startups.","detail_verbatim":"","source_of_info":"Posting text supplied by Mathews in chat","old_value":"","new_value":"","logged_by":"CLAUDE","k":"a"},{"event_id":"EV-00086","timestamp":"2026-09-29 11:20","entity_type":"OPPORTUNITY","entity_id":"OPP-0013","event_type":"EVALUATED","summary":"UI Designer / Web Designer (Foundey) evaluated under P1 using the fast chat format. LinkedIn job title reads 'UI Designer' but the full posting body describes a 'Web Designer' role — flagged as an inconsistency in the posting itself. Track INTL / REPLACE. Gates PASS (Brazil-listed, arrangement UNCLEAR but not disqualifying). Priority C: real, confirmed gap on 'Mandatory proficiency in Webflow and Framer' — Mathews has no Webflow experience, confirmed directly when asked before the verdict was finalized.","detail_verbatim":"Não tenho, mas acho que vale a pena aplicar, se eu já tenho conhecimento de Framer e é uma das duas (framer e webflow) posso ter chance ainda, inclusive a curva de aprendizagem para webflow para quem sabe framer acho que não é muito alta.","source_of_info":"Stated by Mathews in chat","old_value":"","new_value":"","logged_by":"CLAUDE","k":"a"},{"event_id":"EV-00087","timestamp":"2026-09-29 11:20","entity_type":"OPPORTUNITY","entity_id":"OPP-0013","event_type":"DECIDED","summary":"APPLY-WITH-CONDITIONS. Mathews chose to apply despite the confirmed Webflow gap, betting on the transferable learning curve from his real Framer experience — his explicit decision, against the agent's caution that a stated 'mandatory' requirement is a common screening/interview checkpoint. Conditions: never declare Webflow proficiency in any field; frame honestly as Framer expertise with fast ramp-up expected; do not claim direct SaaS experience beyond adjacent fintech B2B work. Resume recommended: CV-EN-003 (no new material version needed), file name Mathews-Esaki-Resume-Web-Designer.pdf. Status EVALUATED; Mathews plans to apply via LinkedIn Easy Apply, not yet submitted.","detail_verbatim":"","source_of_info":"P1 evaluation, this session","old_value":"","new_value":"EVALUATED","logged_by":"CLAUDE","k":"a"},{"event_id":"EV-00088","timestamp":"2026-09-29 11:45","entity_type":"APPLICATION","entity_id":"APP-0007","event_type":"SUBMITTED","summary":"APP-0007 submitted to Foundey for OPP-0013 via LinkedIn Easy Apply. Resume CV-EN-003 (same file as APP-0006, shown as Mathews_E_Resume.pdf, confirmed by Mathews). No Summary or Cover Letter field on this form — only four Additional Questions (ANS-0031 to ANS-0034). Flagged overclaim: Mathews answered 'Yes' to the combined Framer/Webflow question despite confirmed lack of real Webflow experience — his own explicit decision, overriding the agent's recommended 'No', recorded per the frozen-snapshot rule. Opportunity status set to APPLIED.","detail_verbatim":"Sobre o 2, vou responder sim e deixar claro que webflow não em outros momentos. Sobre o 4, dos EUA não, e de forma geral nada tão específico de tech companies or SAAS companies. [...] O currículo está com esse nome, mas é o mesmo da vaga anterior.","source_of_info":"Stated by Mathews in chat","old_value":"EVALUATED","new_value":"APPLIED","logged_by":"CLAUDE","k":"p"},{"event_id":"EV-00107","timestamp":"2026-10-04 09:51","entity_type":"APPLICATION","entity_id":"APP-0007","event_type":"REPLY-RECEIVED","summary":"Human reply from Foundey via LinkedIn messages, 2026-10-01 09:49 (seen by Mathews 2026-10-04): asks salary expectation and availability (up to USD 2500/month, full-time, negotiable; fill immediately; contract model not stated), repeats Framer+Webflow / US SaaS preference, and sends a design challenge (about 1 hour) plus portfolio request. Mathews has not replied yet.","detail_verbatim":"Hi Mathews, \n\nThanks for your interest in Foundey and our Designer Position!\n\nTo start, we'd like to confirm your salary expectations and availability. Our salary for this role (full-time designer) is up to $2500 USD (negotiable, based on experience) per month, \nand we need to fill the position immediately.\n\nThe ideal candidate has experience working with Framer and Webflow, professional english skills and past contact/work with SAAS/Startups/Tech companies from the US. \n\n\nIf there is a fit from that perspective, the next step is a short design challenge that we ask you to complete. It shouldn't take more than an hour and you can find it here: \n\nhttps://drive.google.com/file/d/1zQMeTYhPphszsnQv2tPYUqDobVxM3B-c/view?usp=sharing\n\nIf you agree to move forward, please send your results - remember to show us the most of your UI/UX skills! \nAlso, please attach your portfolio and send it to us as soon as you can.\n\n\nIf you have any further questions or need any assistance, don't hesitate to ask!\n\nBest Regards.","source_of_info":"Message pasted by Mathews in chat 2026-10-04","old_value":"status=SUBMITTED; first_reply_date=; first_reply_type=","new_value":"status=SCREENING; first_reply_date=2026-10-01; first_reply_type=TEST-INVITE","logged_by":"CLAUDE","k":"p"},{"event_id":"EV-00109","timestamp":"2026-10-04 21:08","entity_type":"APPLICATION","entity_id":"APP-0007","event_type":"STATUS-CHANGE","summary":"Mathews replied to Foundey's 2026-10-01 message on 2026-10-05 21:04 BRT with the design challenge result (RedlineMD, Framer site), accepting USD 2,500/month, immediate availability, clarifying no professional Webflow experience, and asking the contract model. Awaiting reply.","detail_verbatim":"Hi,\nThank you for getting back to me, and apologies for the delay in replying.\nHere are my challenge results: https://redlinemdfoundey.framer.website/\nWorkflow (a little over an hour): I audited the current site against the brief, mainly on mobile. Then I set the direction and a small design system from RedlineMD's own colors and type, built it in Framer and QA'd desktop, tablet and mobile. I used an AI agent to speed up production, but the direction, decisions and reviews were mine.\nWhat I changed and why:\n• One clear action. \"Get your Analysis\" appears in the hero, in the header and in a sticky mobile CTA. Today the CTA isn't visible on the first mobile screen, which likely feeds the 35% traffic / 10% revenue gap.\n• ROI up front. $199 flat vs $500+ for a legal review, plus the $10,000+ tail-insurance risk shown through real clause examples.\n• Trust. I swapped inconsistent figures for their security standards and a clear disclaimer, and removed the misspelled tagline under the logo.\n• The dashboard reads as a sample of the deliverable, with the sample report one tap away, so ad visitors know exactly what they're paying for.\nSuggested next step: replace the Google Form with a native upload + checkout flow.\nOn your questions: I'm available to start immediately, and the USD 2,500/month for the full-time role works for me.\nRegarding experience: Framer is my main tool for building and publishing sites. I haven't worked with Webflow professionally yet, and I'd rather be upfront about that. I'm confident I'd ramp up quickly given my Framer background.\nCould you also confirm the contract model for this role?\nMy portfolio: https://mathewsportfolio.framer.website/\nBest regards,\nMathews","source_of_info":"Message sent by Mathews on LinkedIn messages 2026-10-05 21:04 BRT, text pasted in chat; sent unchanged from the draft approved in chat","old_value":"status=SCREENING","new_value":"status=TEST","logged_by":"CLAUDE","k":"p"},{"event_id":"EV-00110","timestamp":"2026-10-04 21:14","entity_type":"APPLICATION","entity_id":"APP-0007","event_type":"CORRECTION","summary":"Date error in EV-00109, ANS-0039 and ANS-0040 notes: Mathews sent the challenge message on 2026-10-04 at 21:04 BRT, not 2026-10-05 (the session clock and the writer's EV-00109 timestamp 2026-10-04 21:08 confirm it).","detail_verbatim":"Enviei às 21:04","source_of_info":"Session clock vs. text written by the operating agent; Mathews's message time 21:04 stands","old_value":"sent 2026-10-05 21:04 BRT","new_value":"sent 2026-10-04 21:04 BRT","logged_by":"CLAUDE","k":"a"}],"post":"# OPP-0013 — Foundey — UI Designer (LinkedIn title) / Web Designer (body)\n\nSource: LinkedIn Jobs\nURL: https://www.linkedin.com/jobs/view/4470864731/\nCaptured: 2026-09-29\nLocation: Brazil · posted 22 hours ago · 99 applicants · Promoted by hirer · Company review time typically 1 week\n\n---\n\n[Foundey](https://www.linkedin.com/company/foundeydesign/life/)\n[UI Designer](https://www.linkedin.com/jobs/view/4470864731/)\nBrazil · 22 hours ago · 99 applicants\nPromoted by hirer · Company review time is typically 1 week\n\nAbout the job\n\nAbout Foundey\n\nFoundey (formerly Uitify) is an embedded product design partner for early-stage SaaS and AI startups based in the United States. We help founders improve product clarity, user experience, and go-to-market execution through senior design thinking combined with fast, high-quality execution.We partner closely with ambitious startup teams to transform complex ideas into intuitive products, compelling narratives, and scalable digital experiences. Our work sits at the intersection of product strategy, design excellence, and business growth.\n\nWho we're looking for\n\nWe're looking for a Web Designer who brings strong visual direction, consistency, and creativity. You'll work closely with our branding, marketing, and product teams to design clean, modern, and conversion-focused assets for fast-growing SaaS companies.\nThis is a hands-on creative role — ideal for someone who thrives on bringing ideas to life and shaping the visual expression of digital-first brands and crating websites/landing pages.\n\nWhat you'll do\n\n* Design and deliver high-quality visual assets: landing pages, pitch decks, social media creatives, eBooks, case studies, and more;\n* Ensure consistency and alignment across all brand touchpoints,\n* Collaborate with strategists, copywriters, and product designers to translate ideas into strong visuals;\n* Contribute to branding, product, and marketing initiatives with a focus on performance and clarity;\n* Present and discuss your work with the team and, occasionally, with clients.\n\nWhat we're looking for\n\n* A strong portfolio showcasing digital design (branding, marketing, web, presentations, etc.)\n* 5+ years of experience;\n* Mandatory proficiency in Webflow and Framer - Figma/Canva/Photoshop are differentials;\n* A sharp eye for layout, typography, hierarchy, and color\n* Experience designing for SaaS or B2B tech products\n* Ability to handle multiple projects with clarity, speed, and organization\n* Strong communication skills and attention to detail\n\nBonus points\n\n* Experience working with SaaS companies or startups\n* Experience with People Analytics or B.I.\n* Basic knowledge of UX principles and how design influences user behavior\n* Motion design or video editing skills\n* Strong attention to detail and ability to work independently\n* A proactive, collaborative mindset and a passion for visual storytelling\n\nWhy Join Us?\n\nAt Foundey, you will work on high-impact projects for fast-growing SaaS companies, helping shape the digital tools that protect and empower businesses worldwide. You'll collaborate with talented designers and technologists, contribute to cutting-edge design solutions, and grow your career in a studio that values innovation, ownership, and excellence.\n\nAbout the company\nFoundey\n11,661 followers\nDesign Services • 11-50 employees • 21 on LinkedIn\nEmbedded product design partner for SaaS, AI, and tech startups.\n\nMost founders are shipping faster than they can decide.\nAI raised execution speed and brutally exposed the absence of product judgment.\n\nMore output, more options, more confusion.\n\nThe bottleneck isn't building anymore. It's knowing what to build, what to cut, and what needs to be better before it ships.\n\nThat's not a design problem. It's a judgment problem.\n\nFoundey is the product decision layer for SaaS and AI startups: sharper product thinking and fast execution, in the same team.\n\nWe embed ourselves into your workflow: Slack, weekly sessions, same faces every week, to hold the context your product needs and help make the calls you shouldn't be making alone.\n\nPretty screens don't move the metrics. Better product decisions do.\n\nIf you're in a funding moment, a launch window, or just shipping faster than you can decide: that's exactly where we do our best work.\n","test":{"links":{"LINK_ENTREGA":"https://redlinemdfoundey.framer.website/","LINK_BRIEFING":"https://drive.google.com/file/d/1zQMeTYhPphszsnQv2tPYUqDobVxM3B-c/view?usp=sharing","ENTREGUE_EM":"2026-10-04 21:04"},"secs":[["O que era o teste","Desafio de design de cerca de 1 hora, enviado pela Foundey em 1 out (convite no histórico) para quem aceitasse seguir depois da conversa sobre salário e disponibilidade. O convite pede que o resultado mostre as suas habilidades de UI/UX e que o portfólio acompanhe a entrega.\nConforme a sua mensagem de entrega: o exercício partia do site atual da RedlineMD. Você auditou o site contra o briefing (foco no mobile), definiu a direção e um pequeno design system a partir das cores e da tipografia da própria RedlineMD, construiu no Framer e conferiu desktop, tablet e mobile. Usou um agente de IA para acelerar a produção; direção, decisões e revisões foram suas."],["Briefing","Ainda não guardado aqui. O briefing original está no Google Drive (botão acima) e eu não consigo abri-lo. Para ficar registrado na íntegra, cole o texto do briefing na conversa com o agente."]]},"co":{"company_id":"CO-0012","name":"Foundey (formerly Uitify)","website":"https://www.linkedin.com/company/foundeydesign/","country":"US (per posting: 'based in the United States')","size":"11-50 employees, 21 on LinkedIn (per posting)","type":"Embedded product design partner / design services studio for early-stage SaaS and AI startups (per posting: product clarity, UX, go-to-market execution, product strategy)","hires_from_brazil_signal":"CONFIRMED","contract_model_known":"UNKNOWN","relationship_status":"NO-CONTACT","first_seen_date":"2026-09-29","legitimacy_checked":"NOT-REQUESTED","research_notes":"","do_not_reapply_before":"","block_reason":"","notes":"LinkedIn job title reads 'UI Designer' but the entire posting body describes a 'Web Designer' role — inconsistency in the posting itself, not a system error. Listing location: Brazil, 99 applicants at 22 hours old, promoted by hirer. Arrangement (PJ/CLT/contractor) not stated."},"others":[],"ct":[],"iv":[],"out":[]}</script>
