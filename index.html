 Nobody ever chases you for a missing export. That's the standard here.\n\nWhat you'll own\n\n* Create assets for brands and digital products across our clients' portfolios — and for the platform itself\n* Take a brand from A to Z: key art, promo assets, banners, social and in-product graphics — logos stay with our dedicated logo designers\n* Blend hand-crafted design with AI generation to move at a pace pure manual work can't touch\n* Deliver web-ready assets every time: formats, sizes, compression, naming — organized and ready to deploy\n* Keep multiple brands visually sharp and consistent without slowing down releases\n* Work directly with product and marketing — no layers between you and the work going live\n\nWhat you bring\n\n* Strong portfolio of modern graphic design for digital products and brands — gaming experience a plus\n* High skill in modern design tooling plus confident, hands-on use of AI image generation in real production work\n* Proven ability to take a brand from A to Z — key art, promo assets, banners, social and in-product graphics (logo design excluded)\n* Rigorous, organized asset handling for web: formats, sizes, compression, naming and delivery-ready exports\n* Ability to keep multiple brands visually consistent while producing at pace\n* Strong communication, ownership and reliability working directly with product and marketing\n\nThe benefits\n\n* Top-of-market pay — Industry-leading base comp plus aggressive bonus packages. If you're a unicorn, you're paid like one.\n* Paid annual leave — Paid time off for both contractors and local employees. Take a proper break, then come back sharper.\n* Real gifts — Birthdays and work anniversaries come with actual gifts, not just Slack emojis.\n* Paid trials — If we ask for practical work, it is paid at a premium rate from the first hour.\n* Premium Apple gear — Top-spec hardware and peripherals, always bought new for you.\n* Gym allowance — Your membership is on us. Sharp minds need healthy bodies.\n* Lunch on us — Daily delivery-platform credits to order what you actually want.\n* Elite team — International, ambitious colleagues selected purely on talent and output.\n\n[NOTE] No application link, button or channel was included in what Mathews supplied. Location rule, timezone and arrangement (contractor vs employee) are not stated; the benefits line mentions \"both contractors and local employees\" without saying which applies to this role.\n\n---\n\n[VERBATIM — careers page https://www.craegroup.com/careers/graphics-designer, pasted by Mathews on 2026-10-03. The first section above is the Dribbble listing text; where the two differ, this page is the later and more complete source: salary is shown by level here, and the form fields are listed.]\n\nREMOTEFULL-TIME\nGraphics Designer\nRun the visual firepower behind our brands and digital products — from the first key art to the launch-day asset drop. Your work won't sit in a pitch deck; it goes live, in front of real players and users, across brands that keep coming. Modern tools, AI leverage where it multiplies you, zero bureaucracy between you and shipping — and a team that treats great visuals as a competitive weapon, paid accordingly.\nAnnual salaryUp to€80k\n+ Highly competitive bonus package\nSalary by level\n\n1. Medior€35k–50k\n2. Senior€50k–80k\n3. 🦄Unicorn€80k+, no ceiling\n\n€35k€50k€80k+\nWhere you land depends on your level, your experience and the impact you bring. Unicorns don’t have a ceiling.\nApply now\n[Description, What you'll own, What you bring and The Benefits sections identical to the text above, apart from typographic apostrophes.]\nApplication\nApply for this role.\nSubmit your details and CV. We will review your application and contact you if there is a fit.\nHiring process\nWhat happens after you apply.\n\n1. 01In 24–48 hours\nApplication review\nWe review your experience against the responsibilities and requirements of the role.\n2. 02Within a few days\n15 minutes with the CPO\nA focused 15-minute conversation with Simon S., our CPO, about your background, the role and what you are looking for.\n3. 03Within 1 week\nConsideration\nA short test task, paid at a premium rate from the first hour. Real work says more than another round of questions.\n4. 04Within 2 weeks\nIn depth with the CPO\nA longer conversation with Simon S. to make sure the fit is perfect. If everyone is happy, you get a top-of-the-line offer.\n\nApplication · Graphics Designer\nName *\nEmail *\nPhone\nLeave this field empty\nCountry * (dropdown; includes Brazil)\nRelevant years of experience *\nLink (portfolio, LinkedIn, GitHub — your best one)\nReferred by someone at CRAE? Tell us who.\nCV * — Upload your CV — drag & drop or click — PDF or Word · max 10 MB\nRelevant experience * — 250 more characters needed\nI consent to CRAE Group storing and processing my personal data for the purpose of this application. *\nWe review every application and will contact you if we would like to proceed. [Send application]\n","test":null,"co":{"company_id":"CO-0013","name":"CRAE GROUP","website":"https://craegroup.com/","country":"UNKNOWN","size":"UNKNOWN","type":"Creative/brand production for digital products and clients' brands, gaming and beyond, plus its own platform (per posting; sector not stated)","hires_from_brazil_signal":"UNKNOWN","contract_model_known":"UNKNOWN","relationship_status":"APPLIED","first_seen_date":"2026-10-03","legitimacy_checked":"NOT-REQUESTED","research_notes":"","do_not_reapply_before":"","block_reason":"","notes":"Posting mentions 'both contractors and local employees' in the benefits but does not say which applies to the Graphics Designer role. Salary posted in EUR, annual, by level (Medior 35-50k, Senior 50-80k, Unicorn 80k+). hires_from_brazil_signal LIKELY only because Brazil is selectable in the application form country dropdown; no explicit statement."},"others":["OPP-0015"],"ct":[],"iv":[],"out":[]}</script>

wed by the same CPO would dilute and could contaminate the stronger application. No company research done (not requested).","priority":"C","decision":"DO-NOT-APPLY","decision_date":"2026-10-03","decision_rationale":"Gates pass provisionally, but the role's mandatory requirements (Figma design-system mastery, dev-ready specified deliverables, gaming/crypto/fintech UI experience) are ones he cannot claim, and the same company's Graphics Designer role (OPP-0014) is a much better fit; one application to the company, not two. Recommendation to Mathews, in answer to his question whether to apply to both; if he confirms real strict-design-system Figma and dev-ready work, reassess with a new event. He may also raise interest in the UI seat on the CPO call of the OPP-0014 application, without claiming anything he cannot.","status":"DISCARDED","application_id":"","notes":"Evaluated 2026-10-03 in P1 fast chat format as an answer to Mathews's question of whether to apply to both CRAE GROUP roles.","display_company":"CRAE GROUP","display_summary":"UI & Visual Designer seat at the same company, €60k–€90k/year. It demands strict design-system Figma mastery, dev-ready specs and gaming/crypto/fintech UI experience, which don't match what you can claim — the Graphics Designer role is the better one.","display_points":["Mandatory Figma design-system mastery is not confirmed in your record","Dev-ready, specified deliverables run into your no-developer-handoff-ownership rule","Same company as the Graphics Designer role — apply to one, not both"]},"a":null,"corr":[],"ans":[],"ev":[{"event_id":"EV-00095","timestamp":"2026-10-03 00:00","entity_type":"COMPANY","entity_id":"CO-0013","event_type":"CREATED","summary":"Company record created for CRAE GROUP (OPP-0014).","detail_verbatim":"","source_of_info":"Posting text supplied by Mathews in chat","old_value":"","new_value":"","logged_by":"CLAUDE","k":"a"},{"event_id":"EV-00100","timestamp":"2026-10-03 00:00","entity_type":"OPPORTUNITY","entity_id":"OPP-0015","event_type":"EVALUATED","summary":"UI & Visual Designer (CRAE GROUP, same company as OPP-0014) evaluated under P1, fast chat format, in answer to Mathews's question whether to apply to both roles. Track INTL / REPLACE (default, unconfirmed). Gates PASS provisionally: arrangement UNCLEAR ('100% full-time, no part-time, no hourly contracts'), location UNCLEAR ('Limassol or Remote'). Comp EUR 60k-90k/year plus bonus. Priority C: mandatory Figma design-system mastery unconfirmed, dev-ready handoff collides with do-not-claim rule, no gaming/crypto UI experience.","detail_verbatim":"","source_of_info":"Posting text supplied by Mathews in chat","old_value":"","new_value":"","logged_by":"CLAUDE","k":"a"},{"event_id":"EV-00101","timestamp":"2026-10-03 00:00","entity_type":"OPPORTUNITY","entity_id":"OPP-0015","event_type":"DECIDED","summary":"DO-NOT-APPLY (recommendation; fit, not a gate failure). One application to CRAE GROUP only, for OPP-0014. If Mathews confirms real strict-design-system Figma work and dev-ready deliverables, reassess with a new event.","detail_verbatim":"","source_of_info":"Posting text supplied by Mathews in chat","old_value":"","new_value":"decision=DO-NOT-APPLY; priority=C; status=DISCARDED","logged_by":"CLAUDE","k":"a"}],"post":"# OPP-0015 — CRAE GROUP — UI & Visual Designer\n\nSource: Dribbble (job listing; the apply link presumably leads to the company's careers site, as for OPP-0014 — not confirmed for this one)\nURL: NOT-POSTED (no URL supplied by Mathews)\nCaptured: 2026-10-03\n\n---\n\n[VERBATIM — posting text as pasted by Mathews]\n\nUI & Visual Designer\n\nWE HIRE UNICORNS. THEN WE GET OUT OF THEIR WAY.\n\nWe'd rather run a team of unicorns than a large corporate machine. We've built the entire company around that choice. No layers, no politics, no corporate theatre — the C-level ships alongside you, the pace is real, and the bar is unapologetically high. If that made you lean in, keep reading.\n\nRole: UI & Visual Designer\n\nSalary: €60,000-€90,000 per year\n\n————————————————\n\nTHE ROLE\n\nSit at the seam where brand art meets web UI — and make the join invisible. Nothing stuck on, nothing weird, one world. You'll shape how entire brands feel in the browser, inside a design system that's actually respected and with engineers who build what you specify, pixel for pixel. High trust, high pace, no design-by-committee — your craft goes live fast and stays yours. If you've ever wished the whole company took design as seriously as you do, that's how we operate.\n\nEvery brand we ship runs on two engines: hand-crafted assets from the graphics team and web UI built by the UI team. Your seat is the symbiosis — compiling both into one brand where everything blends and nothing looks bolted on.\n\nYou've done this before — gaming, crypto, fintech or similar, at real pace, on new brands rolling out and live brands kept sharp. You're an absolute Figma pro: strict design system, UI kits, componentized files. That part is mandatory — you live and breathe this way of working or this isn't your seat. And everything you deliver is dev-ready: actionable, specified, buildable. Nothing here is just for paint.\n\n————————————————\n\nWHAT YOU'LL OWN\n\n• Bridge graphics and UI: compile hand-crafted brand assets and web UI into one seamless visual world\n\n• Design web UI for gaming brands and digital products inside a strict design system and UI kits\n\n• Deliver dev-ready designs only — specified, componentized and buildable, never just decoration\n\n• Roll out new brands and keep existing ones sharp, without quality drift in either direction\n\n• Hunt down every seam where an asset meets the UI and make the blend invisible\n\n• Stay ahead of design trends in modern JS-framework products and keep evolving your style to fit where we're going\n\n————————————————\n\nWHAT IT TAKES\n\n• Strong experience in comparable UI design roles for gaming, crypto, fintech or similar digital products in fast-paced environments\n\n• Absolute Figma mastery — strict design systems and UI kits as the default way of working\n\n• Proven ability to bridge UI design and graphic design so brand assets and web UI blend seamlessly\n\n• Experience delivering dev-ready, actionable designs — specified and buildable, never decoration\n\n• Up to date with modern design trends in JS-framework products and what current frontends can actually build\n\n• Comfort rolling out new brands and maintaining live ones while constantly evolving skills and style\n\n————————————————\n\nWHO WE ARE\n\nEvery C-level is in the day-to-day. The people setting the direction are the same people reviewing your work, unblocking your decisions, and getting their hands dirty next to you. You will never present to a committee. You will never wait three weeks for a sign-off. The distance between \"good idea\" and \"live in production\" is a conversation, not a process.\n\nWe serve platforms with 100M+ users and a billion monthly events. That scale is usually reserved for companies with a thousand employees and an org chart you need a map for. We do it with a fraction of the headcount — which means every single person here has real leverage, real ownership, and work that visibly matters the same week they ship it.\n\nTitles are thin. Trust is thick. If you're exceptional, this is the most fun you'll ever have at work.\n\n————————————————\n\nTHE PACKAGE\n\nGreat people have options. We know it — so the package is built to end the conversation, not start a negotiation.\n\n• Top-of-market pay — industry-leading base comp plus aggressive bonus packages. If you're a unicorn, you're paid like one.\n\n• 100% full-time — every role is a proper full-time position. No part-time, no hourly contracts.\n\n• Limassol or Remote — work from our sunny Cyprus HQ or get a proper, connected remote setup.\n\n• Paid annual leave — proper breaks are part of doing great work.\n\n• Premium Apple gear — top-spec hardware and peripherals, always bought new for you.\n\n• Gym allowance — your membership is on us. Sharp minds need healthy bodies.\n\n• Lunch on us — daily delivery-platform credits to order what you actually want.\n\n• Real gifts — birthdays and work anniversaries come with actual gifts, not just Slack emojis.\n\n• Elite team — international, ambitious colleagues selected purely on talent and output.\n\nOUR HIRING PROMISE: your time is worth money. The industry normalised free \"test projects\". We think that's disrespectful — any trial work with us is paid at a very high rate, whether you join or not.\n\n[NOTE] Company name is not in the pasted text; Mathews stated it is the same company as OPP-0014 (CRAE GROUP), found on Dribbble. No posting URL supplied.\n","test":null,"co":{"company_id":"CO-0013","name":"CRAE GROUP","website":"https://craegroup.com/","country":"UNKNOWN","size":"UNKNOWN","type":"Creative/brand production for digital products and clients' brands, gaming and beyond, plus its own platform (per posting; sector not stated)","hires_from_brazil_signal":"UNKNOWN","contract_model_known":"UNKNOWN","relationship_status":"APPLIED","first_seen_date":"2026-10-03","legitimacy_checked":"NOT-REQUESTED","research_notes":"","do_not_reapply_before":"","block_reason":"","notes":"Posting mentions 'both contractors and local employees' in the benefits but does not say which applies to the Graphics Designer role. Salary posted in EUR, annual, by level (Medior 35-50k, Senior 50-80k, Unicorn 80k+). hires_from_brazil_signal LIKELY only because Brazil is selectable in the application form country dropdown; no explicit statement."},"others":["OPP-0014"],"ct":[],"iv":[],"out":[]}</script>

/* ---------- posting formatter: structure only, the words stay verbatim ---------- */
const BUL=/^\s*(?:[*\-•·✅✔☑]|\d+[.)])\s*/;
function isHeading(t,next){if(!t||t.length>60||BUL.test(t))return false;if(/[.,;]$/.test(t))return false;if(/:$/.test(t))return true;if(t===t.toUpperCase()&&/[A-ZÀ-Ú]{3}/.test(t))return true;return !!next&&BUL.test(next)&&t.split(/\s+/).length<=7;}
const postLines=raw=>raw.replace(/\r/g,"").split("\n");
function formatPosting(raw){
  const lines=postLines(raw);let label="",notes=[],out=[],list=null,first=true;
  const flush=()=>{if(list){out.push(`<ul>${list.map(x=>`<li>${x}</li>`).join("")}</ul>`);list=null;}};
  for(let i=0;i<lines.length;i++){
    let l=lines[i];const tag=l.match(/^\s*\[(VERBATIM[^\]]*)\]\s*/);
    if(tag){label=tag[1].replace(/^VERBATIM\s*[—-]?\s*/,"").toLowerCase();l=l.slice(tag[0].length);if(!l.trim())continue;}
    if(/^\s*\[/.test(l)&&!/^\s*\[[^\]]*\]\(/.test(l)){notes.push(l.replace(/^\s*\[(NOTE\]\s*)?/,"").replace(/\]\s*$/,""));continue;}
    const t=l.trim();if(!t){flush();continue;}
    let j=i+1;while(j<lines.length&&!lines[j].trim())j++;const next=lines[j]?lines[j].trim():"";
    if(first){out.push(`<p class="pt">${esc(t)}</p>`);first=false;continue;}
    if(BUL.test(t)){const it=t.replace(BUL,"");if(it)(list=list||[]).push(linkify(it));continue;}
    flush();if(isHeading(t,next)){out.push(`<h5>${esc(t.replace(/:$/,""))}</h5>`);continue;}
    out.push(`<p>${linkify(t)}</p>`);
  }
  flush();
  return `<span class="src">Texto original${label?" · "+esc(label):""}</span>`+out.join("")+(notes.length?`<div class="pnote"><b>Nota do registro:</b> ${notes.map(esc).join(" ")}</div>`:"");
}
const REQ=/(requirement|qualification|must|what you|you have|you bring|about you|skills|experience|requisito|qualifica|o que buscamos|perfil|diferencia|nice to have|bonus)/i;
function requirements(raw){
  if(!raw)return[];const L=postLines(raw).map(x=>x.trim());const out=[];let cur=null;
  for(let i=0;i<L.length;i++){const t=L[i];if(!t)continue;let j=i+1;while(j<L.length&&!L[j])j++;
    if(isHeading(t,L[j]||"")||(/:$/.test(t)&&t.length<70)){cur=REQ.test(t)?{h:t.replace(/:$/,""),items:[]}:null;if(cur)out.push(cur);continue;}
    if(!cur)continue;const b=BUL.test(t);if(cur.items.length&&cur.bul&&!b){cur=null;continue;}
    if(t.length<400){cur.bul=cur.bul||b;cur.items.push(t.replace(BUL,""));}}
  return out.filter(x=>x.items.length);
}

  FT[r.id]={post:fold(d.post),ans:fold(d.ans.map(x=>x.question_verbatim+" "+x.answer_verbatim).join(" ")+" "+(a.key_answers_summary||"")),notes:fold([d.o.fit_notes,d.o.decision_rationale,d.o.display_summary,(d.o.display_points||[]).join(" "),d.o.notes,a.positioning_used,a.claims_emphasized,a.notes].join(" "))};}return FT;}

function renderRows(P){
  const v=P.get("v")||"all",q=fold(P.get("q")||"").trim(),sort=P.get("s")||"recent";
  const vf=(VIEWS.find(x=>x[0]===v)||VIEWS[0])[2];
  let rows=IDX.filter(r=>vf(r)&&(!P.get("tr")||r.tr===P.get("tr"))&&(!P.get("dec")||r.dec===P.get("dec"))&&(!P.get("pr")||r.pr===P.get("pr"))&&(!P.get("src")||r.src===P.get("src"))&&(!P.get("m")||(r.df||"").startsWith(P.get("m"))));
  const hits={};
  if(q){const terms=q.split(" ").filter(Boolean);const ft=q.length>=3?fullText():null;
    const wr=terms.map(t=>new RegExp("(^|[^a-z0-9])"+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")));
    rows=rows.filter(r=>{if(terms.every(t=>r.s.includes(t)))return true;if(!ft)return false;const x=ft[r.id];
      for(const[k,lab]of[["ans","nas suas respostas"],["post","no anúncio"],["notes","na análise"]])if(wr.every(re=>re.test(x[k]))){hits[r.id]=lab;return true;}return false;});}
  const key={recent:r=>r.li||r.dd||r.df||"",silent:r=>r.li?r.li:"9",found:r=>r.df||"",pr:r=>r.pr||"Z",co:r=>fold(r.co)}[sort];
  rows.sort((a,b)=>{const x=key(a),y=key(b);if(sort==="silent"||sort==="pr"||sort==="co")return x<y?-1:x>y?1:0;return x<y?1:x>y?-1:0;});
  $("#cnt").innerHTML=`<b>${rows.length}</b> de ${IDX.length}${q?` · busca: “${esc(P.get("q"))}”`:""}`;
  const shown=rows.slice(0,LIMIT);

   ${sec("Para lembrar",(o.display_points||[]).length?`<ul class="pts prose">${o.display_points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>`:"")}
   ${sec("O que você declarou",`<div class="blk">${kv([["Nível",esc(SEN[a.seniority_presented]||a.seniority_presented)],["Posicionamento",nask(a.positioning_used)&&clamp(a.positioning_used,200)],["Destaques",nask(a.claims_emphasized)&&clamp(a.claims_emphasized,200)],["Salário",salFull(d).replace("<small>",'<div class="fine">').replace("</small>","</div>")],["Inglês",esc(nask(a.english_level_declared))]])}</div>`)}
   ${sec("O que o anúncio pede",req.length?`<div class="blk">${req.map(g=>`<div class="grp" style="margin:0 0 6px">${esc(g.h)}</div><ul class="pts" style="margin-bottom:12px">${g.items.map(i=>`<li>${linkify(i)}</li>`).join("")}</ul>`).join("")}<p class="fine">Trechos copiados do anúncio, sem interpretação.</p></div>`:`<p class="empty">Veja o texto completo na aba Anúncio.</p>`)}
   ${sec("Lacunas e análise de fit",o.fit_notes?fold_("Ler análise completa",`<div class="prose">${linkify(o.fit_notes)}</div>`):"")}
   ${sec("Entrevistas",d.iv.length?d.iv.map(x=>`<div class="blk">${kv([["Rodada",esc(ROUND[x.round]||x.round)],["Quando",esc(x.scheduled_datetime_brt)],["Resultado",esc(x.outcome)],["Compromissos",esc(x.commitments_made)],["Preparação",esc(x.prep_notes)]])}</div>`).join(""):`<p class="empty">Nenhuma entrevista registrada ainda.</p>`)}
   ${sec("Perguntas para fazer a eles",`<ul class="pts">${ASK.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`)}`;
}
function tPost(r,d){
  const o=d.o;
  if(d.post)return `<div class="post">${formatPosting(d.post)}</div>`;
  return `<p class="empty">${o.posting_snapshot==="NOT-STORED"?"Anúncio não guardado: vaga descartada (o registro guarda o link e o motivo).":"Texto do anúncio não encontrado."}</p>${/^https?:/.test(o.posting_url||"")?`<p style="margin-top:8px"><a href="${esc(o.posting_url)}" target="_blank" rel="noopener">Abrir o link original ↗</a></p>`:""}`;
}
function evBlock(e){return `<div><div class="evh"><b>${esc(EVT[e.event_type]||e.event_type)}</b><span>${fd(e.timestamp)} ${esc(e.timestamp.slice(11,16))}</span><span class="code">${esc(e.event_id)}</span></div><div class="x">${clamp(e.summary,240)}</div>${e.detail_verbatim?`<div class="q" style="margin-top:6px">${clamp(e.detail_verbatim,200)}</div>`:""}${e.old_value||e.new_value?`<div style="margin-top:6px">${ba(e)}</div>`:""}</div>`;}
function tTech(r,d){
  const o=d.o,a=d.a,aud=d.ev.filter(e=>e.k==="a");
  const GATE={"PASS":"Passou","FAIL":"Não passou"};
  const c=(label,code)=>`${label} <span class="code">${esc(code)}</span>`;
  return `<p class="techintro">Informações de controle do registro: identificadores, códigos de classificação, correções e eventos de auditoria. Úteis para conferir ou corrigir dados — não são necessárias no uso diário.</p>
   <div class="blk"><span class="lab">Identificação</span>${kv([["Oportunidade",`<span class="code">${esc(o.opportunity_id)}</span>`],a&&["Candidatura",`<span class="code">${esc(a.application_id)}</span>`],["Empresa",`<span class="code">${esc(o.company_id)}</span>`],["Arquivo do anúncio",`<span class="code">${esc(o.posting_snapshot)}</span>`]])}</div>
   <div class="blk"><span class="lab">Classificação</span>${kv([["Trilha",c(TRACK[o.track]||o.track,o.track)],["Objetivo",`<span class="code">${esc(o.intended_outcome)}</span>`],["Critérios de busca",c(GATE[o.gate_result]||o.gate_result,o.gate_result)+(o.gate_failed_reason&&o.gate_failed_reason!=="—"?` <span class="code">${esc(o.gate_failed_reason)}</span>`:"")],["Compatível com a W2",`<span class="code">${esc(o.compatibility_verdict)}</span>`],["Status no registro",`<span class="code">${esc(o.status)}</span>`],["Como foi encontrada",esc(o.search_method)]])}</div>
   ${d.corr.length?`<div class="blk"><span class="lab">Correções sobre a candidatura</span>${d.corr.map(x=>`<p>${esc(x.field)}: <s>${esc(x.old)}</s> → <b>${esc(x.new)}</b> <span class="code">${esc(x.ev)}</span></p>`).join("")}<p class="fine" style="margin-top:6px">O registro original é congelado; as correções são eventos e a interface mostra o valor corrigido.</p></div>`:""}
   ${o.notes||(a&&a.notes)?`<div class="blk"><span class="lab">Notas internas</span>${o.notes?`<p class="lab" style="text-transform:none;letter-spacing:0;margin-bottom:4px">Oportunidade</p><div class="prose x">${clamp(o.notes,300)}</div>`:""}${a&&a.notes?`<p class="lab" style="text-transform:none;letter-spacing:0;margin:12px 0 4px">Candidatura</p><div class="prose x">${clamp(a.notes,300)}</div>`:""}</div>`:""}
   ${aud.length?`<div class="blk"><span class="lab">Eventos de auditoria · ${aud.length}</span><div class="evl">${aud.map(evBlock).join("")}</div></div>`:""}`;
}

/* ---------- Métricas ---------- */
function viewMetrics(){
  head(`Busca de vagas / <b>Métricas</b>`,"Métricas");
  const apps=IDX.filter(applied),mature=apps.filter(r=>days(r.ds)>=21);
  const adv=r=>["screening","test","interview","offer","hired"].includes(r.st)||r.niv>0;
  const tracks=[...new Set(IDX.map(r=>r.tr))],srcs=[...new Set(IDX.map(r=>r.src))];
  const rd=IDX.filter(r=>r.fr&&r.ds).map(r=>days(r.ds)-days(r.fr)).sort((a,b)=>a-b);
  const fun=rows=>{const ap=rows.filter(applied).length;return [["Vagas avaliadas",rows.length,rows.length],["Passaram nos critérios",rows.filter(r=>r.gate==="PASS").length,rows.length],["Candidaturas",ap,rows.length],["Com resposta",rows.filter(r=>r.fr).length,ap],["Avançaram",rows.filter(adv).length,ap],["Entrevistas",rows.filter(r=>r.niv).length,ap]];};
  const bars=rows=>`<div class="bars">${fun(rows).map(([l,n,of],i)=>`<div><div class="bar-t"><span>${l}</span><span>${i===0?n:`${n} de ${of}`}</span></div><div class="track"><i style="width:${of?n/of*100:0}%"></i></div></div>`).join("")}</div>`;
  view.innerHTML=`<div class="mgrid">
   <section class="card pad"><h2>Funil geral</h2><div class="sub" style="margin-bottom:16px">${mature.length} candidatura(s) com 21+ dias${mature.length<10?" · taxas a partir de 10: por enquanto, dados insuficientes":""}</div>${bars(IDX)}</section>
   <div class="stack"><section class="card pad"><h2>Tempo até a primeira resposta</h2><p style="margin-top:12px"><span style="font-size:24px;font-weight:700">${rd.length?rd[Math.floor(rd.length/2)]:"—"}</span> <span class="sub">${rd.length?`dia(s), mediana de ${rd.length} resposta(s)`:"nenhuma resposta ainda"}</span></p></section>
   <section class="card"><div class="ch"><div><h2>Fontes</h2><div class="sub">Onde você encontrou cada vaga</div></div></div><table class="t"><thead><tr><th>Fonte</th><th class="n">Vagas</th><th class="n">Cand.</th><th class="n">Resp.</th></tr></thead><tbody>${srcs.map(s=>{const rows=IDX.filter(r=>r.src===s);return `<tr><td>${esc(SRC[s]||s)}</td><td class="n">${rows.length}</td><td class="n">${rows.filter(applied).length}</td><td class="n">${rows.filter(r=>r.fr).length}</td></tr>`;}).join("")}</tbody></table><p class="note pad" style="margin:0;padding-top:12px">Uma fonte só ganha taxa de resposta a partir de 10 candidaturas.</p></section></div>
   <section class="card" style="grid-column:1/-1"><div class="ch"><div><h2>Por trilha</h2></div></div><div style="overflow-x:auto"><table class="t"><thead><tr><th>Trilha</th><th class="n">Avaliadas</th><th class="n">Passaram</th><th class="n">Candidaturas</th><th class="n">Respostas</th><th class="n">Entrevistas</th></tr></thead><tbody>${tracks.map(t=>{const rows=IDX.filter(r=>r.tr===t);return `<tr><td>${esc(TRACK[t]||t)}</td><td class="n">${rows.length}</td><td class="n">${rows.filter(r=>r.gate==="PASS").length}</td><td class="n">${rows.filter(applied).length}</td><td class="n">${rows.filter(r=>r.fr).length}</td><td class="n">${rows.filter(r=>r.niv).length}</td></tr>`;}).join("")}</tbody></table></div></section>
  </div>`;
}

route();
</script>
</body>
</html>
